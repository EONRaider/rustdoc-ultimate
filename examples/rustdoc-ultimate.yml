name: rustdoc-ultimate

# Default trigger: run on every pull request targeting main/master and open
# a second PR with any documentation fixes. Copy this file to
# .github/workflows/ in your Rust repository and adjust as needed.
#
# NOTE: `push` is not a usable trigger here. The underlying
# anthropics/claude-code-action rejects raw push events ("Unsupported event
# type: push" — see https://github.com/anthropics/claude-code-action/issues/1456),
# so pull_request is the supported default instead.
on:
  pull_request:
    branches: [main, master]

  # Alternative/additional triggers — uncomment as needed.
  #
  # Run manually from the Actions tab, with mode/scope overrides:
  # workflow_dispatch:
  #   inputs:
  #     mode:
  #       description: "Guardrail mode"
  #       type: choice
  #       default: conservative
  #       options: [conservative, aggressive]
  #     scope:
  #       description: "Files to review"
  #       type: choice
  #       default: changed-files
  #       options: [changed-files, whole-repo]
  #
  # Run on a schedule, e.g. a weekly whole-repo sweep:
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write
  issues: write # lets the action create pull_request_labels that don't exist yet
  id-token: write # required by anthropics/claude-code-action even with anthropic_api_key

jobs:
  rustdoc-ultimate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: eonraider/rustdoc-ultimate@v1
        with:
          # See the "Using rustdoc-ultimate as a GitHub Action" section of
          # this repo's README for the full input reference.
          mode: conservative # or: ${{ inputs.mode }} if using workflow_dispatch above
          scope: changed-files # or: ${{ inputs.scope }} if using workflow_dispatch above
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
